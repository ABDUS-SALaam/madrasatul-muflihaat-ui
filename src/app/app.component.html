<app-maintenance *ngIf="isUnderMaintenance"></app-maintenance>

<div *ngIf="!isUnderMaintenance">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg py-2 fixed-top shadow-lg transition-all"
      [ngClass]="isDark ? 'navbar-dark' : 'navbar-light'"
      [ngStyle]="{'background': isDark ? 'rgba(20, 30, 48, 0.95)' : 'rgba(255, 255, 255, 0.95)'}">

      <div class="container-fluid px-4">

          <a class="navbar-brand d-flex align-items-center" routerLink="/home">
              <img src="assets/logo.png" class="logo-hover" alt="Logo">
              <div class="ms-3 d-none d-lg-block">
                  <h5 class="mb-0 fw-bold" [ngClass]="isDark ? 'text-white' : 'text-dark'">
                      Madrasatul-Muflihaat
                  </h5>
                  <p class="mb-0 small text-muted">Online & Offline Institute</p>
              </div>
          </a>

          <button class="navbar-toggler border-0 shadow-sm" type="button"
                  data-bs-toggle="collapse" data-bs-target="#navbarNav">
              <span class="navbar-toggler-icon"></span>
          </button>

          <div id="navbarNav" class="collapse navbar-collapse">
              <ul class="navbar-nav ms-auto align-items-center">

                  <li class="nav-item mx-2" *ngFor="let link of ['home','about','courses','contact']">
                      <a class="nav-link fw-semibold px-3 py-2 rounded-3 nav-link-hover"
                          [routerLink]="['/' + link]"
                          routerLinkActive="active"
                          (click)="setActive(link)">
                          {{ link | titlecase }}
                      </a>
                  </li>

                  <li class="nav-item mx-3 d-none d-lg-block"><div class="divider"></div></li>
                  <li class="nav-item mx-2 d-none d-lg-block">
                    <div class="hijri-badge shadow-sm"
                         [ngClass]="isDark ? 'hijri-dark' : 'hijri-light'"
                         [attr.title]="hijriFullDate">
                      <i class="bi bi-moon-stars-fill me-1"></i>
                      <span>{{ hijriDate }}</span>
                    </div>
                  </li>
                  
                  <!-- <li class="nav-item mx-2">
                      <button class="btn btn-sm px-3 py-2 rounded-pill shadow-sm"
                              (click)="toggleTheme()"
                              [ngClass]="isDark ? 'btn-warning' : 'btn-dark'">
                          <i class="bi" [ngClass]="isDark ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
                      </button>
                  </li> -->

              </ul>
          </div>

      </div>
  </nav>

  <router-outlet></router-outlet>

</div>
