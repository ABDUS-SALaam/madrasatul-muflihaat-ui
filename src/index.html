<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Madrasatul Muflihaat – Online & Offline Islamic Institute</title>

    <!-- Meta description -->
    <meta
      name="description"
      content="Madrasatul Muflihaat is an online and offline Islamic institute offering structured Quran, Tajweed, Arabic, and Islamic studies courses for sisters and children."
    />

    <!-- Keywords (not very important for Google, but harmless) -->
    <meta
      name="keywords"
      content="Madrasatul Muflihaat, Islamic institute, online madrasa, Quran classes, Tajweed, Arabic, Islamic studies"
    />

    <!-- Canonical URL (choose the main one you prefer) -->
    <link rel="canonical" href="https://www.madrasatulmuflihaat.com/" />

    <!-- Open Graph for social media (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Madrasatul Muflihaat – Online & Offline Islamic Institute"
    />
    <meta
      property="og:description"
      content="Madrasatul Muflihaat is an Islamic institute providing online and offline classes in Quran, Tajweed, Arabic, and Islamic studies."
    />
    <meta property="og:url" content="https://www.madrasatulmuflihaat.com/" />
    <!-- Replace with your logo/banner when you have one -->
    <meta
      property="og:image"
      content="https://madrasatulmuflihaat.com/assets/logo.png"
    />

    <base href="/" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Animate.css -->
    <link
      href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <!-- AOS -->
    <link
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
</html>
